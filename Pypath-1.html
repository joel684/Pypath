<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyPath — Learn Python & FastAPI</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1b232e; --border:#28313d;
  --text:#e6edf3; --muted:#8b98a9; --accent:#58a6ff; --accent2:#3fb950;
  --kw:#ff7b72; --st:#a5d6ff; --num:#79c0ff; --fn:#d2a8ff; --cm:#7d8590; --op:#e3b341;
  --radius:12px;
}
body.light{
  --bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --border:#d8dee4;
  --text:#1f2328; --muted:#656d76; --accent:#0969da; --accent2:#1a7f37;
  --kw:#cf222e; --st:#0a3069; --num:#0550ae; --fn:#8250df; --cm:#6e7781; --op:#953800;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65; -webkit-font-smoothing:antialiased;
  font-size:16px;
}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:16px;
  padding:10px 18px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);
  border-radius:8px;font-size:18px;padding:4px 10px;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,#3776ab,#ffd43b);
  display:grid;place-items:center;font-weight:800;color:#0d1117;font-size:14px;
}
.brand strong{display:block;font-size:15px;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.progress-wrap{margin-left:auto;display:flex;align-items:center;gap:10px}
.progress{width:180px;height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}
.pct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;
  padding:4px 9px;cursor:pointer;font-size:15px}

/* ---------- layout ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.sidebar{
  width:310px;flex:none;position:sticky;top:57px;height:calc(100vh - 57px);
  overflow-y:auto;padding:18px 12px 60px;border-right:1px solid var(--border);
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
.mod{margin-bottom:6px}
.mod-head{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  font-weight:650;font-size:13.5px;letter-spacing:.2px;color:var(--text);
}
.mod-head .ico{font-size:15px}
.mod-head .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.lesson-link{
  display:flex;align-items:center;gap:9px;
  padding:7px 10px 7px 14px;margin:1px 0 1px 8px;
  border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;
  border-left:2px solid transparent;cursor:pointer;
}
.lesson-link:hover{background:var(--panel2);color:var(--text)}
.lesson-link.active{background:var(--panel2);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.lesson-link .tick{
  width:15px;height:15px;flex:none;border-radius:50%;border:1.5px solid var(--border);
  display:grid;place-items:center;font-size:9px;color:transparent;
}
.lesson-link.done .tick{background:var(--accent2);border-color:var(--accent2);color:#0d1117}
.lesson-link.done{color:var(--text)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:34px 44px 120px;max-width:1000px}
.crumb{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:8px}
h1{font-size:31px;line-height:1.25;margin:0 0 10px;letter-spacing:-.5px}
.goal{color:var(--muted);font-size:15px;margin:0 0 26px;padding-left:13px;border-left:3px solid var(--accent)}
h2{font-size:19px;margin:36px 0 12px;letter-spacing:-.2px}
h3{font-size:16px;margin:0 0 8px}
.prose p{margin:0 0 14px;color:var(--text)}
.prose code, .symbols code, .ex code{
  background:var(--panel2);border:1px solid var(--border);border-radius:5px;
  padding:1px 5px;font-size:.88em;color:var(--accent);
}
b,strong{font-weight:650}

/* ---------- code block ---------- */
.codeblock{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin:0 0 8px;
}
.cline{
  display:grid;grid-template-columns:2.6rem minmax(0,1fr);
  border-bottom:1px solid color-mix(in srgb,var(--border) 45%, transparent);
}
.cline:last-child{border-bottom:none}
.codeblock.has-notes .cline{grid-template-columns:2.6rem minmax(0,1.15fr) minmax(0,1fr)}
.ln{
  color:var(--muted);opacity:.5;font-size:12px;text-align:right;padding:7px 10px 7px 0;
  font-family:ui-monospace,monospace;user-select:none;
}
.cd{
  padding:7px 14px 7px 0;font-size:13.5px;white-space:pre-wrap;word-break:break-word;
  line-height:1.6;display:block;
}
.nt{
  font-size:12.5px;color:var(--muted);padding:7px 14px;line-height:1.55;
  border-left:1px dashed var(--border);
}
.t-kw{color:var(--kw)} .t-st{color:var(--st)} .t-num{color:var(--num)}
.t-fn{color:var(--fn)} .t-cm{color:var(--cm);font-style:italic} .t-op{color:var(--op);font-weight:600}
.t-dec{color:var(--fn)}

/* ---------- terminal ---------- */
.term{
  background:#010409;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:12px 0 0;
}
body.light .term{background:#0d1117}
.term-head{
  display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--panel2);
  border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;font-weight:600;
}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.term pre{margin:0;padding:13px 15px;font-size:13px;color:#c9d1d9;white-space:pre-wrap;line-height:1.6}

/* ---------- symbols ---------- */
.symbols{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin:14px 0 0}
.sym{display:grid;grid-template-columns:120px 1fr;background:var(--panel);gap:14px;padding:10px 14px;align-items:start}
.sym code{
  background:none;border:none;color:var(--op);font-weight:700;font-size:14px;padding:0;
  font-family:ui-monospace,monospace;
}
.sym span{font-size:13.5px;color:var(--muted);line-height:1.6}

/* ---------- exercise ---------- */
.exercise{
  background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent2);
  border-radius:var(--radius);padding:20px 22px;margin:38px 0 0;
}
.exercise h3{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:6px}
.exercise p{margin:0 0 14px;font-size:14.5px;color:var(--muted)}
textarea{
  width:100%;min-height:130px;resize:vertical;
  background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13.5px;line-height:1.65;outline:none;tab-size:4;
}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#04120a}
.btn.primary:hover{filter:brightness(1.12);color:#04120a}
.fb{margin-top:14px;display:grid;gap:7px}
.fb .row{
  display:flex;gap:9px;align-items:flex-start;font-size:13.5px;
  padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);
}
.fb .ok{border-color:color-mix(in srgb,var(--accent2) 50%, transparent);color:var(--accent2)}
.fb .bad{border-color:color-mix(in srgb,var(--kw) 45%, transparent)}
.fb .bad .hint{color:var(--muted)}
.fb .hint{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- nav ---------- */
.lesson-nav{display:flex;gap:10px;align-items:center;margin-top:50px;padding-top:22px;border-top:1px solid var(--border)}
.lesson-nav .spacer{flex:1}

/* ---------- cheatsheet ---------- */
.search{
  width:100%;padding:11px 15px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:14.5px;outline:none;margin-bottom:22px;font-family:inherit;
}
.search:focus{border-color:var(--accent)}
.cs-cat{font-size:12.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--accent);font-weight:700;margin:26px 0 10px}
.cs-row{
  display:grid;grid-template-columns:140px 1fr minmax(0,1.1fr);gap:16px;
  padding:11px 14px;border-bottom:1px solid var(--border);align-items:start;
}
.cs-row:hover{background:var(--panel)}
.cs-sym{font-family:ui-monospace,monospace;font-weight:700;color:var(--op);font-size:14px}
.cs-desc{font-size:13.5px;color:var(--muted)}
.cs-ex{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--text);
  background:var(--panel);padding:4px 9px;border-radius:6px;border:1px solid var(--border);
  overflow-x:auto;white-space:pre}
.cs-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

/* ---------- playground ---------- */
.pg{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:16px 18px}
.pg-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.pg-actions{display:flex;gap:8px}
.pg textarea{min-height:90px}
.pg kbd{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:0 5px;
  font-size:11.5px;font-family:ui-monospace,monospace}
.api{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px}
.api-note{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--panel2);color:var(--op);border:1px solid var(--border);border-radius:99px;
  padding:4px 11px;font-size:12.5px;font-family:ui-monospace,monospace;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--accent)}
.api-row{display:flex;gap:8px;flex-wrap:wrap}
.api-row select,.api-row input{background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;outline:none}
.api-row input{flex:1;min-width:150px}
.api-row select:focus,.api-row input:focus{border-color:var(--accent)}
.term pre.err{color:#ff7b72}

@media (max-width:980px){
  .codeblock.has-notes .cline{grid-template-columns:2.2rem minmax(0,1fr)}
  .nt{grid-column:2;border-left:none;border-top:1px dashed var(--border);padding-top:4px;padding-bottom:9px}
  .sym{grid-template-columns:1fr;gap:4px}
  .cs-row{grid-template-columns:1fr;gap:6px}
}
@media (max-width:820px){
  .menu-btn{display:block}
  .sidebar{
    position:fixed;left:0;top:57px;height:calc(100vh - 57px);background:var(--bg);
    transform:translateX(-100%);transition:transform .25s;z-index:40;width:290px;
  }
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  main{padding:24px 18px 100px}
  h1{font-size:25px}
  .progress{width:100px}
}
.tiers{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tier{font:600 13px inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:6px 14px;cursor:pointer;border-left:4px solid var(--tc,var(--accent))}
.tier.on{background:var(--tc,var(--accent));color:#0d1117;border-color:transparent}.tier small{opacity:.7}
.chal{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--tc);border-radius:var(--radius);padding:16px 18px;margin:0 0 16px}
.chal.solved{background:color-mix(in srgb,var(--accent2) 7%,var(--panel))}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}.chead h3{margin:0}.chead small{color:var(--muted)}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 9px;border-radius:99px;background:var(--tc);color:#0d1117}
.ok{margin-left:auto;color:var(--accent2);font-weight:650;font-size:13px}.lock{color:var(--muted)}
.chcode{width:100%;min-height:130px;resize:vertical;background:#010409;color:#e6edf3;border:1px solid var(--border);border-radius:10px;padding:12px;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;tab-size:4;outline:none}
.chcode:focus{border-color:var(--tc)}.chbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chout{margin:0;white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}.chout:empty{display:none}
.chout.pass{color:var(--accent2);font-weight:650}.chout.fail{color:#ff7b72}
.bcode{min-height:120px;background:#010409;color:#e6edf3;border:1px solid var(--border);border-radius:12px;padding:18px;font:22px/1.7 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin:0 0 14px;overflow-x:auto}
.bcode mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.ghost{opacity:.28}.cur{display:inline-block;width:10px;height:1.1em;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.bcard{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:18px 20px;margin-bottom:14px;min-height:130px}
.bsym{font:700 54px/1.1 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);margin-bottom:10px;word-break:break-all}
.bexp{font-size:20px;line-height:1.5}.bpos{color:var(--muted);font-size:12.5px;margin-top:10px}.bhint{color:#ff7b72;margin-top:8px;font-size:14px}
#bi{width:100%;font:22px ui-monospace,Menlo,Consolas,monospace;padding:12px 14px}
.qopts{display:grid;gap:10px}.qopt{text-align:left;font:inherit;font-size:17px;line-height:1.45;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer;transition:.15s}
.qopt:hover{border-color:var(--accent)}.qopt.ok{background:color-mix(in srgb,var(--accent2) 22%,var(--panel));border-color:var(--accent2)}.qopt.bad{background:color-mix(in srgb,#ff7b72 22%,var(--panel));border-color:#ff7b72}
.lookup{margin-top:12px;color:var(--muted)}.tkn{cursor:pointer;border-radius:4px}.tkn:hover,.tkn.sel{background:color-mix(in srgb,var(--accent) 30%,transparent)}.bsymi{font-family:ui-monospace,Menlo,monospace;color:var(--accent);font-size:1.2em}
.bt{width:100%;border-collapse:collapse}.bt td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:14px}
/* ===== PyPath+ extras ===== */
#scrollbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tb-extra{display:flex;align-items:center;gap:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar{box-shadow:0 10px 30px -22px #000}
.logo{box-shadow:0 4px 16px -4px #3776ab}
h1{background:linear-gradient(90deg,var(--text) 40%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson-link{transition:background .15s,transform .15s}.lesson-link:hover{transform:translateX(3px)}
.codeblock,.term{position:relative;transition:box-shadow .25s,border-color .25s}
.codeblock:hover,.term:hover{border-color:var(--accent);box-shadow:0 10px 34px -20px var(--accent)}
.copy-btn{position:absolute;top:6px;right:8px;z-index:2;font:600 11px ui-monospace,monospace;color:var(--muted);background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:3px 9px;cursor:pointer;opacity:0;transition:opacity .15s}
.codeblock:hover .copy-btn,.term:hover .copy-btn,.copy-btn:focus{opacity:1}
@media(hover:none){.copy-btn{opacity:.8}}
main>*{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
body.focus .sidebar{display:none}body.focus main{margin:0 auto;max-width:860px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--panel);border:1px solid var(--accent);padding:10px 18px;border-radius:99px;z-index:120;transition:.3s;box-shadow:0 12px 40px -12px #000;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:130}
#toTop{position:fixed;right:20px;bottom:22px;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toTop.show{opacity:1;pointer-events:auto}
.modal-bg{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);z-index:110;display:grid;place-items:start center;padding:8vh 14px;overflow:auto}
.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 30px 80px -20px #000}
.modal h2{margin:0 0 14px}.modal h3{margin:20px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px}
.stats div{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}.stats small,.mrow small{color:var(--muted);font-size:11.5px}
.mrow{display:grid;grid-template-columns:1fr 110px 34px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.mbar{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden}.mbar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:4px;background:var(--panel2);border:1px solid var(--border)}.heat i.on{background:var(--accent2);border-color:var(--accent2)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);cursor:pointer;margin-right:6px}
.mrow2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.pal{padding:12px;margin-top:6vh}.pal-in{width:100%;padding:12px 14px;font-size:16px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;outline:none}
.pal-in:focus{border-color:var(--accent)}
.pal-it{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px;margin-top:4px}
.pal-it small{color:var(--muted)}.pal-it.sel,.pal-it:hover{background:var(--panel2);box-shadow:inset 3px 0 var(--accent)}
/* ===== PyPath cyberpunk HUD ===== */
:root{--nc:#00f0ff;--nm:#ff2a6d;--ny:#f5e642;--nbg:#0a0612;--np:#150c28;--nt:#a9a3d6}
.hud{display:flex;align-items:center;gap:9px;font:700 12px ui-monospace,Menlo,Consolas,monospace;color:var(--nc);background:var(--nbg);border:1px solid var(--nc);padding:4px 12px;cursor:pointer;text-shadow:0 0 8px var(--nc);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.hud:hover,.hud:focus-visible{background:#1d1038;outline:none}
.hud em{font-style:normal;color:var(--ny);text-shadow:0 0 8px var(--ny)}

<script type="text/plain" id="pp-shim">
# ---- PyPath playground runtime: code runner + mini FastAPI/Pydantic ----
import sys, types, json, inspect, re, io, contextlib, traceback, linecache
from urllib.parse import parse_qs

class HTTPException(Exception):
    def __init__(self, status_code, detail=None, headers=None):
        Exception.__init__(self, detail)
        self.status_code = status_code
        self.detail = detail

class ValidationError(ValueError):
    def __init__(self, errors):
        self.errors = errors
        lines = ["%d validation error(s)" % len(errors)]
        for e in errors:
            lines.append("  %s: %s" % (".".join(str(x) for x in e["loc"]), e["msg"]))
        ValueError.__init__(self, "\n".join(lines))

def _bool_parse(v):
    if isinstance(v, bool):
        return v
    if isinstance(v, int) and v in (0, 1):
        return bool(v)
    if isinstance(v, str):
        s = v.strip().lower()
        if s in ("true", "1", "yes", "on", "t", "y"):
            return True
        if s in ("false", "0", "no", "off", "f", "n"):
            return False
    raise ValueError("Input should be a valid boolean")

def _coerce(v, tp):
    if tp is bool:
        return _bool_parse(v)
    if tp is int:
        if isinstance(v, bool):
            raise ValueError("Input should be a valid integer")
        if isinstance(v, int):
            return v
        if isinstance(v, float) and v.is_integer():
            return int(v)
        if isinstance(v, str):
            try:
                return int(v.strip())
            except ValueError:
                pass
        raise ValueError("Input should be a valid integer")
    if tp is float:
        if isinstance(v, bool):
            raise ValueError("Input should be a valid number")
        if isinstance(v, (int, float)):
            return float(v)
        if isinstance(v, str):
            try:
                return float(v.strip())
            except ValueError:
                pass
        raise ValueError("Input should be a valid number")
    if tp is str:
        if isinstance(v, str):
            return v
        raise ValueError("Input should be a valid string")
    if isinstance(tp, type) and issubclass(tp, BaseModel) and isinstance(v, dict):
        return tp(**v)
    return v

def _hints(cls):
    h = {}
    for k in reversed(cls.__mro__):
        if k is object or k is BaseModel:
            continue
        h.update(inspect.get_annotations(k))
    return h

class BaseModel:
    def __init__(self, **data):
        errors = []
        for name, tp in _hints(type(self)).items():
            if name in data:
                try:
                    setattr(self, name, _coerce(data[name], tp))
                except ValidationError as e:
                    for x in e.errors:
                        errors.append({"type": x["type"], "loc": [name] + x["loc"], "msg": x["msg"]})
                except ValueError as e:
                    errors.append({"type": "value_error", "loc": [name], "msg": str(e), "input": data[name]})
            elif hasattr(type(self), name):
                setattr(self, name, getattr(type(self), name))
            else:
                errors.append({"type": "missing", "loc": [name], "msg": "Field required"})
        if errors:
            raise ValidationError(errors)

    def model_dump(self, **_):
        def conv(v):
            if isinstance(v, BaseModel):
                return v.model_dump()
            if isinstance(v, (list, tuple)):
                return [conv(x) for x in v]
            if isinstance(v, dict):
                return {k: conv(x) for k, x in v.items()}
            return v
        return {n: conv(getattr(self, n)) for n in _hints(type(self))}
    dict = model_dump   # pydantic v1 name, still works (deprecated)

    def model_dump_json(self, **_):
        return json.dumps(self.model_dump(), separators=(",", ":"))   # compact, like pydantic

    @classmethod
    def model_validate(cls, obj):
        return cls(**obj) if isinstance(obj, dict) else obj

    def model_copy(self, *, update=None):
        return type(self)(**{**self.model_dump(), **(update or {})})

    def __eq__(self, other):
        return type(self) is type(other) and self.model_dump() == other.model_dump()

    def __repr__(self):
        inner = ", ".join("%s=%r" % (n, getattr(self, n)) for n in _hints(type(self)))
        return "%s(%s)" % (type(self).__name__, inner)

class _Depends:
    def __init__(self, dependency=None):
        self.dependency = dependency

def Depends(dependency=None):
    return _Depends(dependency)

class FastAPI:
    def __init__(self, *args, **kwargs):
        self._routes = []

    def _add(self, method, path, status_code, rm=None):
        def deco(fn):
            self._routes.append({"method": method, "path": path, "fn": fn,
                                 "status": status_code or 200, "rx": _compile(path), "rm": rm})
            return fn
        return deco

    def get(self, path, status_code=None, **kw):    return self._add("GET", path, status_code, kw.get("response_model"))
    def post(self, path, status_code=None, **kw):   return self._add("POST", path, status_code, kw.get("response_model"))
    def put(self, path, status_code=None, **kw):    return self._add("PUT", path, status_code, kw.get("response_model"))
    def patch(self, path, status_code=None, **kw):  return self._add("PATCH", path, status_code, kw.get("response_model"))
    def delete(self, path, status_code=None, **kw): return self._add("DELETE", path, status_code, kw.get("response_model"))

def _compile(path):
    parts = re.split(r"(\{\w+\})", path)
    rx = "".join("(?P<%s>[^/]+)" % p[1:-1] if re.fullmatch(r"\{\w+\}", p) else re.escape(p) for p in parts)
    return re.compile("^" + rx + "$")

def _is_model(tp):
    return isinstance(tp, type) and issubclass(tp, BaseModel)

async def _handle(app, method, url, body_text):
    path, _, qs = url.partition("?")
    query = {k: v[0] for k, v in parse_qs(qs, keep_blank_values=True).items()}
    matched, path_ok = None, False
    for r in app._routes:
        m = r["rx"].match(path)
        if m:
            path_ok = True
            if r["method"] == method:
                matched = (r, m.groupdict())
                break
    if matched is None:
        return (405, {"detail": "Method Not Allowed"}) if path_ok else (404, {"detail": "Not Found"})
    r, pvals = matched
    fn = r["fn"]
    kwargs, errors = {}, []
    for name, p in inspect.signature(fn).parameters.items():
        tp = p.annotation if p.annotation is not inspect.Parameter.empty else str
        if name in pvals:
            try:
                kwargs[name] = _coerce(pvals[name], tp)
            except ValueError as e:
                errors.append({"type": "value_error", "loc": ["path", name], "msg": str(e), "input": pvals[name]})
        elif _is_model(tp):
            if not (body_text or "").strip():
                errors.append({"type": "missing", "loc": ["body"], "msg": "Field required"})
                continue
            try:
                data = json.loads(body_text)
            except ValueError:
                errors.append({"type": "json_invalid", "loc": ["body"], "msg": "JSON decode error"})
                continue
            if not isinstance(data, dict):
                errors.append({"type": "model_attributes_type", "loc": ["body"], "msg": "Input should be a valid dictionary or object"})
                continue
            try:
                kwargs[name] = tp(**data)
            except ValidationError as e:
                for x in e.errors:
                    x["loc"] = ["body"] + x["loc"]
                    errors.append(x)
        elif isinstance(p.default, _Depends):
            dep, dk = p.default.dependency, {}
            for dn, dp in inspect.signature(dep).parameters.items():
                dt = dp.annotation if dp.annotation is not inspect.Parameter.empty else str
                if dn in query:
                    try:
                        dk[dn] = _coerce(query[dn], dt)
                    except ValueError as e:
                        errors.append({"type": "value_error", "loc": ["query", dn], "msg": str(e), "input": query[dn]})
                elif dp.default is not inspect.Parameter.empty:
                    dk[dn] = dp.default
                else:
                    errors.append({"type": "missing", "loc": ["query", dn], "msg": "Field required"})
            if not errors:
                try:
                    v = dep(**dk)
                    if inspect.isawaitable(v):
                        v = await v
                    kwargs[name] = v
                except HTTPException as e:
                    return e.status_code, {"detail": e.detail}
        elif name in query:
            try:
                kwargs[name] = _coerce(query[name], tp)
            except ValueError as e:
                errors.append({"type": "value_error", "loc": ["query", name], "msg": str(e), "input": query[name]})
        elif p.default is not inspect.Parameter.empty:
            kwargs[name] = p.default
        else:
            errors.append({"type": "missing", "loc": ["query", name], "msg": "Field required"})
    if errors:
        return 422, {"detail": errors}
    try:
        res = fn(**kwargs)
        if inspect.isawaitable(res):
            res = await res
    except HTTPException as e:
        return e.status_code, {"detail": e.detail}
    except Exception:
        traceback.print_exc()
        return 500, {"detail": "Internal Server Error"}
    rm = r.get("rm")
    if rm is not None and _is_model(rm):
        data = res.dict() if isinstance(res, BaseModel) else res
        if isinstance(data, dict):
            res = {k: data[k] for k in _hints(rm) if k in data}
    return r["status"], res

def _ser(o):
    if isinstance(o, BaseModel):
        return o.dict()
    return str(o)

_STATE = {"ns": None, "real": False}

def _find_app():
    ns = _STATE["ns"] or {}
    if isinstance(ns.get("app"), FastAPI):
        return ns["app"]
    for v in ns.values():
        if isinstance(v, FastAPI):
            return v
    return None

def _sample(tp):
    return {int: 1, float: 1.5, bool: True, str: "text"}.get(tp, "text")

def _psample(tp):
    return {int: "1", float: "1.5", bool: "true", str: "demo"}.get(tp, "demo")

def _qsample(tp):
    return {int: "1", float: "1.5", bool: "true", str: "python"}.get(tp, "python")

def _pp_routes():
    app = _find_app()
    if app is None:
        return "[]"
    out = []
    for r in app._routes:
        names = re.findall(r"\{(\w+)\}", r["path"])
        params = inspect.signature(r["fn"]).parameters
        url = r["path"]
        for n in names:
            tp = params[n].annotation if n in params and params[n].annotation is not inspect.Parameter.empty else str
            url = url.replace("{%s}" % n, _psample(tp))
        q, body = [], ""
        for n, p in params.items():
            if n in names:
                continue
            tp = p.annotation if p.annotation is not inspect.Parameter.empty else str
            if _is_model(tp):
                d = {}
                for fname, ftp in _hints(tp).items():
                    d[fname] = getattr(tp, fname) if hasattr(tp, fname) else _sample(ftp)
                body = json.dumps(d)
            elif p.default is inspect.Parameter.empty:
                q.append("%s=%s" % (n, _qsample(tp)))
        if q:
            url += "?" + "&".join(q)
        out.append({"method": r["method"], "path": r["path"], "url": url, "body": body})
    return json.dumps(out)

async def _pp_request(req_json):
    req = json.loads(req_json)
    app = _find_app()
    if app is None:
        return json.dumps({"status": 0, "body": "No FastAPI app found. Press Run first.", "out": ""})
    buf = io.StringIO()
    with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
        status, res = await _handle(app, req["method"].upper(), req["url"], req.get("body") or "")
    try:
        text = json.dumps(res, separators=(",", ":"), default=_ser)
    except Exception:
        text = str(res)
    return json.dumps({"status": status, "body": text, "out": buf.getvalue()})

def _clean_tb(exc, skip):
    frames = [f for f in traceback.extract_tb(exc.__traceback__) if f.filename == "<playground>"]
    lines = []
    if frames:
        lines.append("Traceback (most recent call last):")
        for f in frames:
            lines.append('  File "<playground>", line %d, in %s' % (f.lineno - skip, f.name))
            if f.line:
                lines.append("    " + f.line.strip())
    if isinstance(exc, SyntaxError) and skip and exc.lineno:
        exc.lineno -= skip
    lines.extend(l.rstrip("\n") for l in traceback.format_exception_only(type(exc), exc))
    return "\n".join(lines)

def _pp_run(code, skip=0):
    if not _STATE.get("real") and re.search(r"fastapi|pydantic", code):
        fa = types.ModuleType("fastapi")
        fa.FastAPI = FastAPI
        fa.HTTPException = HTTPException
        fa.Depends = Depends
        pd = types.ModuleType("pydantic")
        pd.BaseModel = BaseModel
        pd.ValidationError = ValidationError
        sys.modules["fastapi"] = fa
        sys.modules["pydantic"] = pd
    linecache.cache["<playground>"] = (len(code), None, code.splitlines(True), "<playground>")
    g = {"__name__": "__main__"}
    _STATE["ns"] = g
    buf = io.StringIO()
    ok = True
    with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
        try:
            exec(compile(code, "<playground>", "exec"), g)
        except SystemExit:
            pass
        except BaseException as e:
            ok = False
            buf.write(_clean_tb(e, skip) + "\n")
    return json.dumps({"ok": ok, "out": buf.getvalue()})

<script type="text/plain" id="pp-real">
# ---- PyPath playground runtime: REAL FastAPI + pydantic running in the browser ----
import sys, types, json, inspect, re, io, contextlib, traceback, linecache, asyncio, warnings

warnings.filterwarnings("ignore", category=DeprecationWarning)

# The built-in mini engine may have planted stand-in `fastapi`/`pydantic` modules: remove them first.
for _n in ("fastapi", "pydantic"):
    _m = sys.modules.get(_n)
    if _m is not None and getattr(_m, "__file__", None) is None:
        del sys.modules[_n]

# Browsers have no threads. FastAPI runs plain `def` endpoints in a worker thread
# (anyio.to_thread.run_sync), so we make that call run inline instead.
import anyio.to_thread

async def _run_sync_inline(func, *args, **kwargs):
    return func(*args)

anyio.to_thread.run_sync = _run_sync_inline

import fastapi
import fastapi.routing
import pydantic
import starlette

# `uvicorn` cannot open a socket in a browser; give `uvicorn.run(...)` a harmless stand-in.
_uv = types.ModuleType("uvicorn")
def _uv_run(app=None, host="127.0.0.1", port=8000, **kwargs):
    print("INFO:     Uvicorn running on http://%s:%s (Press CTRL+C to quit)" % (host, port))
    print("INFO:     (in this playground the Send button below plays the role of the browser)")
_uv.run = _uv_run
sys.modules["uvicorn"] = _uv

_RT = {"ns": None, "skip": 0}

def _rt_find_app():
    ns = _RT["ns"] or {}
    if isinstance(ns.get("app"), fastapi.FastAPI):
        return ns["app"]
    for v in ns.values():
        if isinstance(v, fastapi.FastAPI):
            return v
    return None

def _rt_clean_tb(exc, skip):
    frames = [f for f in traceback.extract_tb(exc.__traceback__) if f.filename == "<playground>"]
    lines = []
    if frames:
        lines.append("Traceback (most recent call last):")
        for f in frames:
            lines.append('  File "<playground>", line %d, in %s' % (f.lineno - skip, f.name))
            if f.line:
                lines.append("    " + f.line.strip())
    if isinstance(exc, SyntaxError) and skip and exc.lineno:
        exc.lineno -= skip
    lines.extend(l.rstrip("\n") for l in traceback.format_exception_only(type(exc), exc))
    text = "\n".join(lines)
    if "can't start new thread" in text:
        text += ("\nHint: browsers cannot start threads, and TestClient needs one. "
                 "Copy this code and run it on your own computer with: pytest")
    return text

def _pp_run_real(code, skip=0):
    linecache.cache["<playground>"] = (len(code), None, code.splitlines(True), "<playground>")
    g = {"__name__": "__main__"}
    _RT["ns"] = g
    _RT["skip"] = skip
    buf = io.StringIO()
    ok = True
    with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
        try:
            exec(compile(code, "<playground>", "exec"), g)
        except SystemExit:
            pass
        except BaseException as e:
            ok = False
            buf.write(_rt_clean_tb(e, skip) + "\n")
    return json.dumps({"ok": ok, "out": buf.getvalue()})

# ---------- sample requests for the "Send" panel ----------

def _unwrap(tp):
    # Optional[X] / Union[X, None]  ->  X
    args = getattr(tp, "__args__", None)
    if args and type(None) in args:
        rest = [a for a in args if a is not type(None)]
        if len(rest) == 1:
            return rest[0]
    return tp

def _is_model(tp):
    return isinstance(tp, type) and issubclass(tp, pydantic.BaseModel)

def _sample(tp):
    tp = _unwrap(tp)
    if _is_model(tp):
        return _model_sample(tp)
    origin = getattr(tp, "__origin__", None)
    if origin in (list, set, tuple) or tp in (list, set, tuple):
        return []
    if origin is dict or tp is dict:
        return {}
    if tp is bool:
        return True
    if tp is int:
        return 1
    if tp is float:
        return 1.5
    return "text"

def _model_sample(model):
    d = {}
    for name, f in model.model_fields.items():
        if not f.is_required():
            d[name] = f.get_default(call_default_factory=True)
        else:
            d[name] = _sample(f.annotation)
    return d

def _psample(tp):
    tp = _unwrap(tp)
    return {int: "1", float: "1.5", bool: "true", str: "demo"}.get(tp, "demo")

def _qsample(tp):
    tp = _unwrap(tp)
    return {int: "1", float: "1.5", bool: "true", str: "python"}.get(tp, "python")

def _field_required(f):
    try:
        return f.field_info.is_required()
    except Exception:
        return bool(getattr(f, "required", False))

def _ann(f):
    # Newer FastAPI no longer has a type_ attribute on fields; the annotation lives on field_info.
    try:
        return f.field_info.annotation
    except Exception:
        return getattr(f, "type_", str)

def _pp_routes_real():
    app = _rt_find_app()
    if app is None:
        return "[]"
    out = []
    for r in app.routes:
        if not isinstance(r, fastapi.routing.APIRoute):
            continue
        dep = r.dependant
        url = r.path
        for f in dep.path_params:
            url = re.sub(r"\{%s(:\w+)?\}" % re.escape(f.name), _psample(_ann(f)), url)
        q = ["%s=%s" % (f.name, _qsample(_ann(f))) for f in dep.query_params if _field_required(f)]
        if q:
            url += "?" + "&".join(q)
        body = ""
        if dep.body_params:
            if len(dep.body_params) == 1:
                body = json.dumps(_sample(_ann(dep.body_params[0])))
            else:
                body = json.dumps({f.name: _sample(_ann(f)) for f in dep.body_params})
        for m in sorted(r.methods or []):
            if m in ("HEAD", "OPTIONS"):
                continue
            out.append({"method": m, "path": r.path, "url": url, "body": body if m in ("POST", "PUT", "PATCH") else ""})
    return json.dumps(out)

# ---------- send a request straight into the real ASGI app ----------

async def _asgi_call(app, method, url, body_text):
    path, _, qs = url.partition("?")
    body = (body_text or "").encode("utf-8")
    headers = [(b"host", b"127.0.0.1:8000"), (b"accept", b"application/json")]
    if body:
        headers += [(b"content-type", b"application/json"), (b"content-length", str(len(body)).encode())]
    scope = {
        "type": "http", "asgi": {"version": "3.0"}, "http_version": "1.1",
        "method": method, "scheme": "http", "path": path, "raw_path": path.encode(),
        "query_string": qs.encode(), "root_path": "", "headers": headers,
        "client": ("127.0.0.1", 50000), "server": ("127.0.0.1", 8000),
    }
    done = asyncio.Event()
    state = {"sent": False}
    resp = {"status": 500, "body": b""}

    async def receive():
        if not state["sent"]:
            state["sent"] = True
            return {"type": "http.request", "body": body, "more_body": False}
        await done.wait()
        return {"type": "http.disconnect"}

    async def send(msg):
        if msg["type"] == "http.response.start":
            resp["status"] = msg["status"]
        elif msg["type"] == "http.response.body":
            resp["body"] += msg.get("body", b"")
            if not msg.get("more_body"):
                done.set()

    try:
        await app(scope, receive, send)
    except Exception as e:
        # Like uvicorn: the client already got "500 Internal Server Error"; the traceback goes to the server log.
        print(_rt_clean_tb(e, _RT["skip"]))
    return resp["status"], resp["body"].decode("utf-8", "replace")

async def _pp_request_real(req_json):
    req = json.loads(req_json)
    app = _rt_find_app()
    if app is None:
        return json.dumps({"status": 0, "body": "No FastAPI app found. Press Run first.", "out": ""})
    buf = io.StringIO()
    with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
        status, text = await _asgi_call(app, req["method"].upper(), req["url"], req.get("body") or "")
    return json.dumps({"status": status, "body": text, "out": buf.getvalue()})

def _pp_versions():
    return json.dumps({"fastapi": fastapi.__version__, "pydantic": pydantic.VERSION, "starlette": starlette.__version__})

# Tell the built-in mini engine to stop injecting its fake `fastapi`/`pydantic` modules.
try:
    _STATE["real"] = True
except NameError:
    pass

const HL = /(#[^\n]*)|([ft]?"""[\s\S]*?"""|[ft]?'''[\s\S]*?'''|[ft]?"(?:\\.|[^"\\])*"|[ft]?'(?:\\.|[^'\\])*')|(@[A-Za-z_][\w.]*)|\b(def|return|if|elif|else|for|while|in|not|and|or|import|from|as|class|try|except|finally|with|lambda|pass|break|continue|None|True|False|async|await|yield|raise|global|del|assert|is)\b|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)(?=\s*\()|([+\-*\/%=<>!&|^~:.,;{}\[\]()]+)/g;

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function hl(code){
  let out = '', last = 0, m;
  HL.lastIndex = 0;
  while ((m = HL.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1]?'cm' : m[2]?'st' : m[3]?'dec' : m[4]?'kw'
              : m[5]?'num' : m[6]?'fn' : 'op';
    out += '<span class="t-' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

None

  {
    id:'for', title:'for loops — repeat without repeating',
    goal:'Do the same thing to every item in a collection.',
    intro:`<p>A <code>for</code> loop walks through a collection one item at a time. The pattern is always the same:</p>
    <p><code>for ITEM in COLLECTION:</code> then an indented block.</p>
    <p><code>range(n)</code> generates the numbers 0, 1, 2 … n-1.</p>`,
    symbols:[
      ['for ... in ...:','The loop header. Ends with a colon.'],
      ['range(3)','Produces 0, 1, 2 — stops <b>before</b> 3.'],
      ['enumerate()','Gives you both the index and the item.'],
      ['break','Jump out of the loop immediately.'],
      ['continue','Skip to the next item.']

    code:`for fruit in ["apple", "banana"]:
    print(fruit)

for i in range(3):
    print("i is", i)

for index, fruit in enumerate(["a", "b"]):
    print(index, fruit)

total = 0

    notes:[

      [1,'Indented → this is the loop body. It runs once per item.'],
      [3,'range(3) gives 0, 1, 2 — three values, starting at zero.'],
      [6,'enumerate() hands you the position and the value together.'],
      [9,'We start with an empty accumulator.'],
      [11,'Add each number onto the running total.'],
      [12,'After the loop finishes, total holds 10.']

      hint:'range(1, 4) produces 1, 2, 3. The print must be indented 4 spaces or the loop body will be empty.',

    }
  },

  {
    id:'while', title:'while loops, break and continue',
    goal:'Loop until a condition changes.',
    intro:`<p>A <code>while</code> loop repeats <b>as long as</b> a condition stays True. Use it when you do not know in advance how many times you need to loop.</p>
    <p><b>Warning:</b> if the condition never becomes False, your program hangs forever. Always change something inside the loop.</p>`,
    symbols:[
      ['while ...:','Loop header. Ends with a colon.'],
      ['+=','Shorthand: <code>count += 1</code> is the same as <code>count = count + 1</code>.'],
      ['break','Exits the loop immediately.'],
      ['continue','Skips the rest of this round and starts the next one.']
    ],
    code:`count = 0
while count < 3:
    print("count is", count)
    count += 1

print("done")

for n in range(10):

        continue
    if n == 5:

    print(n)`,

      [3,'+= 1 is shorthand for count = count + 1. Without this the loop never ends!'],

count is 1
count is 2
done
0
1
3
4`,
    exercise:{

        [/while\s+n\s*<=\s*3\s*:/,'Write: while n <= 3:'],

/* ================= MODULE 4: FASTAPI ================= */
{
  id:'m4', title:'FastAPI — Building APIs', icon:'⚡',
  lessons:[

  {
    id:'fa-first', title:'Your first FastAPI app',
    goal:'Understand the 4 lines every FastAPI app starts with.',
    intro:`<p><b>FastAPI</b> is a Python library for building web APIs. An API is a program that listens for HTTP requests and sends back data — usually JSON.</p>
    <p>Every FastAPI project follows the same shape: import it, create an <code>app</code> object, then decorate functions to say "when someone requests this URL, run this function".</p>
    <p>Save this as a file called <code>main.py</code>.</p>`,
    symbols:[
      ['from fastapi import FastAPI','Pulls the FastAPI class out of the library.'],
      ['app = FastAPI()','Creates your application object. This is what the server will run.'],
      ['@app.get("/")','A <b>decorator</b>. The @ symbol attaches it to the function below. It means "handle GET requests to /".'],
      ['/','The root path — your site\'s home address.'],
      ['def read_root():','The function that runs when that URL is requested.'],
      ['return {"message": "..."}','Returning a dict makes FastAPI send it as JSON automatically.']
    ],
    code:`from fastapi import FastAPI

app = FastAPI()

@app.get("/")
def read_root():
    return {"message": "Hello, World"}

@app.get("/health")
def health_check():
    return {"status": "ok"}`,
    notes:[
      [0,'Import the class. `FastAPI` is capitalised — Python is case-sensitive.'],
      [2,'Create the app. You will need this exact name later when you run the server.'],
      [4,'@ starts a decorator. app.get means "listen for GET requests". "/" is the URL path.'],
      [5,'This function is the handler. No arguments needed yet.'],
      [6,'Return a plain dict — FastAPI converts it to JSON for you.'],
      [8,'Add as many routes as you like. Each one is a new decorator + function.']
    ],
    output:`# Visiting http://127.0.0.1:8000/  returns:
{"message":"Hello, World"}

# Visiting http://127.0.0.1:8000/health returns:
{"status":"ok"}`,
    exercise:{
      prompt:'Write the smallest possible FastAPI app: import it, create <code>app</code>, and add a GET route on <code>/</code> that returns <code>{"hello": "world"}</code>.',
      checks:[
        [/from\s+fastapi\s+import\s+FastAPI/,'Start with: from fastapi import FastAPI'],
        [/app\s*=\s*FastAPI\s*\(\s*\)/,'Then: app = FastAPI()'],
        [/@app\s*\.\s*get\s*\(\s*["']\/["']\s*\)/,'Decorate with @app.get("/")'],
        [/def\s+\w+\s*\(\s*\)\s*:/,'Then define a function with no arguments.'],
        [/return\s*\{/,'Return a dictionary.']
      ],
      hint:'Four parts: the import, the app object, the decorator line, and the function that returns a dict. Remember the colon after the function signature and 4-space indentation.',
      solution:'from fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get("/")\ndef read_root():\n    return {"hello": "world"}',
      output:'{"hello":"world"}'
    }
  },

  {
    id:'fa-uvicorn', title:'Running the server (fastapi dev & uvicorn)',
    goal:'Install FastAPI and start your app on a real port.',
    intro:`<p>FastAPI is the framework; <b>uvicorn</b> is the server that actually runs it. Installing <code>fastapi[standard]</code> gives you both, plus the handy <code>fastapi</code> command.</p>
    <p>Start the development server with <code>fastapi dev main.py</code>. The classic <code>uvicorn main:app --reload</code> does the same job and is what you will see in older tutorials and in production.</p>
    <p>With uvicorn, the string <code>main:app</code> means: <b>file</b> <code>main.py</code> → <b>variable</b> <code>app</code>. FastAPI 0.142 needs <b>Python 3.10 or newer</b>.</p>`,
    symbols:[

      ['fastapi[standard]','FastAPI plus uvicorn and other everyday extras, in one install.'],
      ['fastapi dev','FastAPI\'s own command: starts the dev server and reloads when you save.'],
      ['main:app','"main.py" colon "the app variable inside it" (for the uvicorn command).'],
      ['--reload','Restarts the server automatically whenever you save a file. Great for development.'],
      ['--host 0.0.0.0','Makes the server reachable from other machines (useful in Docker).'],
      ['/docs','Free interactive API documentation FastAPI generates for you.']
    ],
    code:`# 0. FastAPI needs Python 3.10 or newer:

# 1. In your terminal, install FastAPI with its recommended extras (includes uvicorn):

# 2. With main.py in the current folder, start the dev server:

# 3. The classic way still works too:
uvicorn main:app --reload

# 4. Open these in your browser:
#    http://127.0.0.1:8000        -> your API
#    http://127.0.0.1:8000/docs   -> automatic interactive docs`,
    notes:[
      [1,'FastAPI 0.142 needs Python 3.10 or newer. Check before installing.'],
      [4,'The [standard] extra installs uvicorn, the fastapi command and other everyday tools in one go.'],
      [7,'fastapi dev runs your app with auto-reload. It finds the app variable in main.py for you.'],
      [10,'Plain uvicorn works the same way: main = main.py, app = the FastAPI() variable.'],
      [13,'The root route you defined.'],
      [14,'FastAPI writes Swagger documentation for you. Click "Try it out" to test your API.']
    ],
    output:`INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)
INFO:     Started reloader process [12345]
INFO:     Application startup complete.`,
    exercise:{
      prompt:'Type the terminal command that starts <code>main.py</code> in development mode with auto-reload. The modern <code>fastapi</code> command or plain <code>uvicorn</code> both count.',
      checks:[
        [/fastapi\s+dev\s+main\.py|uvicorn\s+main\s*:\s*app/,'Use: fastapi dev main.py (or uvicorn main:app).'],
        [/fastapi\s+dev|--reload/,'Development mode means auto-reload: use fastapi dev, or add --reload to uvicorn.']
      ],
      hint:'Modern way: fastapi dev main.py. Classic way: uvicorn main:app --reload (a colon, not a dot, between main and app).',
      solution:'fastapi dev main.py\n# or, the classic way:\n# uvicorn main:app --reload',
      output:`INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)
INFO:     Application startup complete.`
    }
  },

  {
    id:'fa-path', title:'Path parameters',
    goal:'Put variables inside the URL itself.',
    intro:`<p>Often a URL needs to carry data: <code>/items/42</code>. The <code>42</code> is a <b>path parameter</b>.</p>
    <p>You declare it with curly braces in the decorator, then add a matching function parameter. If you add a <b>type hint</b> like <code>: int</code>, FastAPI converts and validates it automatically — and returns a clean error if someone passes <code>/items/abc</code>.</p>`,
    symbols:[
      ['{item_id}','A placeholder inside the URL path.'],
      ['item_id: int','The function parameter must match the name inside the braces.'],
      [': int','The type hint. FastAPI converts "42" → 42 and validates it.'],
      ['/items/{id}','The full route: /items/ followed by anything.']
    ],
    code:`from fastapi import FastAPI

app = FastAPI()

@app.get("/items/{item_id}")
def get_item(item_id: int):
    return {"item_id": item_id, "type": str(type(item_id))}

@app.get("/users/{name}")
def get_user(name: str):
    return {"hello": name}`,
    notes:[
      [4,'The curly braces make item_id a variable part of the URL.'],
      [5,'The parameter name MUST match the name in the braces exactly.'],
      [5,': int tells FastAPI to convert the text from the URL into a real integer.'],
      [6,'item_id arrives as the number 42, not the string "42".'],
      [8,'A string path parameter — anything in that position is accepted.']
    ],
    output:`GET /items/42   ->  {"item_id":42,"type":"<class 'int'>"}
GET /items/abc  ->  422 Unprocessable Entity
                     {"detail":[{"loc":["path","item_id"],"msg":"Input should be a valid integer, unable to parse string as an integer", ...}]}
GET /users/ada  ->  {"hello":"ada"}`,
    exercise:{
      prompt:'Add a route <code>/products/{product_id}</code> where <code>product_id</code> is an <code>int</code>, returning <code>{"id": product_id}</code>.',
      checks:[
        [/@app\s*\.\s*get\s*\(\s*["']\/products\/\{product_id\}["']\s*\)/,'Use @app.get("/products/{product_id}")'],
        [/def\s+\w+\s*\(\s*product_id\s*:\s*int\s*\)\s*:/,'The function parameter must be product_id: int'],
        [/return\s*\{\s*["']id["']\s*:\s*product_id\s*\}/,'Return {"id": product_id}']
      ],
      hint:'Three lines: the decorator, the function signature with the type hint, and the return statement. The names inside {} and the parameter must match exactly.',
      solution:'@app.get("/products/{product_id}")\ndef get_product(product_id: int):\n    return {"id": product_id}',
      output:'GET /products/7  ->  {"id":7}'
    }
  },

  {
    id:'fa-query', title:'Query parameters',
    goal:'Read the ?key=value part of a URL.',
    intro:`<p>Anything after a <code>?</code> in a URL is a <b>query parameter</b>: <code>/search?q=python&limit=5</code>.</p>
    <p>In FastAPI you do <b>nothing special</b> — any function parameter that is <i>not</i> in the path becomes a query parameter automatically.</p>
    <p>Give it a default value to make it optional.</p>`,
    symbols:[
      ['?','Starts the query string in a URL.'],
      ['&','Separates multiple query parameters.'],
      ['q: str','Required — no default, so the caller must supply it.'],
      ['limit: int = 10','Optional — has a default value.'],
      ['?q=python','How the caller passes it.']
    ],
    code:`from fastapi import FastAPI

    code:`from fastapi import FastAPI, HTTPException
from pydantic import BaseModel

app = FastAPI()

class Note(BaseModel):
    title: str
    body: str = ""

notes = {}
next_id = 1

@app.get("/notes")
def list_notes():
    return list(notes.values())

@app.get("/notes/{note_id}")
def get_note(note_id: int):
    if note_id not in notes:
        raise HTTPException(status_code=404, detail="Note not found")
    return notes[note_id]

@app.post("/notes", status_code=201)
def create_note(note: Note):
    global next_id
    new_note = {"id": next_id, "title": note.title, "body": note.body}
    notes[next_id] = new_note
    next_id += 1
    return new_note

@app.delete("/notes/{note_id}")
def delete_note(note_id: int):
    if note_id not in notes:
        raise HTTPException(status_code=404, detail="Note not found")
    del notes[note_id]
    return {"deleted": note_id}`,

code:`def linear(xs, t):
    steps = 0
    for x in xs:
        steps += 1
        if x == t:
            break
    return steps

def binary(xs, t):
    lo, hi, steps = 0, len(xs) - 1, 0
    while lo <= hi:
        steps += 1
        mid = (lo + hi) // 2
        if xs[mid] == t:
            break
        if xs[mid] < t:
            lo = mid + 1
        else:
            hi = mid - 1
    return steps

code:`from functools import lru_cache

calls = 0

def fib_slow(n):
    global calls
    calls += 1
    return n if n < 2 else fib_slow(n - 1) + fib_slow(n - 2)

@lru_cache(maxsize=None)
def fib_fast(n):
    return n if n < 2 else fib_fast(n - 1) + fib_fast(n - 2)

mk('pr-sqlalchemy',`SQLAlchemy — tables as classes`,`Work with database rows as normal Python objects.`,
`<p>Writing SQL by hand gets repetitive. <b>SQLAlchemy</b> is an <b>ORM</b> (object-relational mapper): each table becomes a class, each row an object. It also works with PostgreSQL later by changing only the connection URL.</p><p>In FastAPI you create one <code>Session</code> per request with a dependency that uses <code>yield</code>, so it always closes afterwards: <code>def get_db(): with Session(engine) as db: yield db</code>.</p>`,
[[`DeclarativeBase`,`Parent class of all your table classes.`],[`Mapped[int]`,`Typed column. mapped_column(...) adds options.`],[`create_engine(url)`,`The connection to the database.`],[`create_all`,`Creates any missing tables.`],[`Session`,`A unit of work: add, then commit.`]],
`from sqlalchemy import create_engine, String
from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session

class Base(DeclarativeBase):
    pass

class Note(Base):
    __tablename__ = "notes"
    id: Mapped[int] = mapped_column(primary_key=True)
    title: Mapped[str] = mapped_column(String(100))

engine = create_engine("sqlite://")
Base.metadata.create_all(engine)

with Session(engine) as db:
    db.add(Note(title="Groceries"))
    db.commit()
    note = db.get(Note, 1)
    print(note.id, note.title)`,

mk('pr-cors',`CORS and middleware`,`Let browsers call your API, and run code on every request.`,
`<p>A web page on <code>localhost:3000</code> calling your API on <code>localhost:8000</code> is a different <b>origin</b>, and browsers block it unless the API says it is allowed. That permission system is <b>CORS</b>, added with <code>CORSMiddleware</code>.</p><p><b>Middleware</b> is code that wraps every request: it runs before your route, calls <code>call_next</code>, then can change the response. Typical uses: timing, logging, headers.</p>`,
[[`add_middleware`,`Attach ready-made middleware to the app.`],[`allow_origins`,`Exact sites allowed. Avoid "*" with cookies or logins.`],[`@app.middleware("http")`,`Write your own middleware function.`],[`call_next(request)`,`Hand over to the route and get its response.`]],
`from fastapi import FastAPI, Request
from fastapi.middleware.cors import CORSMiddleware
import time

app = FastAPI()

app.add_middleware(
    CORSMiddleware,
    allow_origins=["http://localhost:3000"],
    allow_methods=["*"],
    allow_headers=["*"],
)

@app.middleware("http")
async def add_timing(request: Request, call_next):
    start = time.perf_counter()
    response = await call_next(request)
    response.headers["X-Process-Time"] = f"{time.perf_counter() - start:.4f}"
    return response

@app.get("/ping")
def ping():
    return {"ok": True}`,

mk('pr-jwt',`JWT and OAuth2 bearer tokens`,`Log users in once, then recognise them on every request.`,
`<p>After login the server hands back a <b>JWT</b> (JSON Web Token): a signed string containing facts like <code>sub</code> (who) and <code>exp</code> (when it expires). The client sends it back as <code>Authorization: Bearer &lt;token&gt;</code>. The server only checks the signature, so it needs no session storage.</p><p><code>OAuth2PasswordBearer</code> is the FastAPI piece that reads that header and adds the Authorize button to <code>/docs</code>. A real <code>/token</code> login route also needs <code>OAuth2PasswordRequestForm</code> and <b>hashed</b> passwords (bcrypt/argon2), never plain text. JWTs are signed, not encrypted: do not put secrets inside.</p>`,
[[`jwt.encode`,`Create a signed token from a dict.`],[`jwt.decode`,`Verify the signature and expiry, then return the dict.`],[`algorithms=[...]`,`Always state which algorithm you accept.`],[`sub / exp`,`Standard claims: subject and expiry time.`],[`tokenUrl`,`Where clients go to get a token.`]],
`import jwt
from datetime import datetime, timedelta, timezone
from fastapi import FastAPI, Depends, HTTPException
from fastapi.security import OAuth2PasswordBearer

SECRET = "change-me"
app = FastAPI()
oauth2 = OAuth2PasswordBearer(tokenUrl="token")

def make_token(user: str):
    exp = datetime.now(timezone.utc) + timedelta(minutes=30)
    return jwt.encode({"sub": user, "exp": exp}, SECRET, algorithm="HS256")

def current_user(token: str = Depends(oauth2)):
    try:
        data = jwt.decode(token, SECRET, algorithms=["HS256"])
    except jwt.PyJWTError:
        raise HTTPException(status_code=401, detail="Invalid token")

const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js';
let pyPromise = null;

function loadPy(onStatus){
  if (pyPromise) return pyPromise;
  pyPromise = new Promise((resolve, reject) => {
    if (onStatus) onStatus('Downloading the Python engine… (first run only, needs internet)');
    const sc = document.createElement('script');
    sc.src = PYODIDE_URL;
    sc.onload = async () => {
      try {
        if (onStatus) onStatus('Starting Python…');
        const py = await loadPyodide();
        py.runPython(document.getElementById('pp-shim').textContent);
        resolve(py);
      } catch (e) { reject(e); }
    };
    sc.onerror = () => reject(new Error('Could not download the Python engine. Check your internet connection and try again.'));
    document.head.appendChild(sc);
  });
  pyPromise.catch(() => { pyPromise = null; });
  return pyPromise;
}
/* ---------- real FastAPI (downloaded on demand; falls back to the built-in mini version) ---------- */
/* Newest FastAPI tested with this Pyodide (Python 3.14, pydantic 2.12). To upgrade later, change this one line and re-test:
   Pyodide fixes the pydantic version, so a FastAPI that needs a newer pydantic will not install. */
const FASTAPI_PKGS = ['fastapi==0.142.2'];
let realPromise = null, realInfo = null, realFailedAt = 0, lastEngine = 'sim';
const wantsApi = code => /\b(fastapi|pydantic|uvicorn)\b/.test(code);

function ensureReal(onStatus){
  if (realInfo) return Promise.resolve(realInfo);
  if (realPromise) return realPromise;
  if (realFailedAt && Date.now() - realFailedAt < 20000) return Promise.reject(new Error('real FastAPI unavailable'));
  realPromise = (async () => {
    const py = await loadPy(onStatus);
    if (onStatus) onStatus('Installing the real FastAPI… (first time only — a few MB, please wait)');
    await py.loadPackage(['micropip', 'pydantic', 'anyio', 'starlette']);
    try { await py.pyimport('micropip').install(FASTAPI_PKGS); }
    catch (e) {
      console.warn('Newest FastAPI could not be installed from PyPI; using the copy bundled with Pyodide:', String(e && e.message || e).slice(-300));
      await py.loadPackage('fastapi');
    }
    if (onStatus) onStatus('Starting FastAPI…');
    py.runPython(document.getElementById('pp-real').textContent);
    realInfo = JSON.parse(py.runPython('_pp_versions()'));
    return realInfo;
  })();
  realPromise.catch(() => { realPromise = null; realFailedAt = Date.now(); });
  return realPromise;
}

async function execPy(code, onStatus, skip){
  const py = await loadPy(onStatus);
  lastEngine = 'sim';
  for (const [re,pkg] of EXTRA_PKGS) if (re.test(code)) { try { if (onStatus) onStatus('Installing '+pkg+'…'); await py.loadPackage('micropip'); await py.pyimport('micropip').install(pkg); } catch(e){ console.warn('extra package failed', pkg, e); } }
  if (wantsApi(code)) {
    try { await ensureReal(onStatus); lastEngine = 'real'; }
    catch (e) { console.warn('Real FastAPI unavailable, using the built-in mini version:', e && e.message ? String(e.message).split('\\n').slice(-3).join(' | ') : e); }
  }
  py.globals.set('_pp_code', code);
  py.globals.set('_pp_skip', skip || 0);
  const fn = lastEngine === 'real' ? '_pp_run_real' : '_pp_run';
  return JSON.parse(py.runPython(fn + '(_pp_code, _pp_skip)'));
}
async function getRoutes(){
  const py = await loadPy();
  return JSON.parse(py.runPython(lastEngine === 'real' ? '_pp_routes_real()' : '_pp_routes()'));
}
async function sendReq(method, url, body){
  const py = await loadPy();
  py.globals.set('_pp_req', JSON.stringify({ method, url, body: body || '' }));
  const fn = lastEngine === 'real' ? '_pp_request_real' : '_pp_request';
  return JSON.parse(await py.runPythonAsync('await ' + fn + '(_pp_req)'));
}

function prettyBody(t){ try { return JSON.stringify(JSON.parse(t), null, 2); } catch(e){ return t; } }

function fitTextarea(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight + 4, 520) + 'px';
}
function enableTab(ta, run){
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input'));
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (run) run();
    }
  });
}

function renderApi(el, routes){
  el.innerHTML = `<div class="api">
    <div class="api-note"><b>⚡ Test your API.</b> ${lastEngine === 'real' && realInfo
      ? `This is the <b>real FastAPI ${esc(realInfo.fastapi)}</b> (pydantic ${esc(realInfo.pydantic)}) running inside your browser — the same code works on your own computer.`
      : `The real FastAPI could not be downloaded just now (no access to PyPI?), so a built-in mini version is running. It covers what this course teaches. Reload the page to try the real one.`}
      Pick a route or type your own request.</div>
    <div class="chips">${routes.map((r, i) => `<button class="chip" data-i="${i}">${esc(r.method)} ${esc(r.path)}</button>`).join('')}</div>
    <div class="api-row">
      <select class="apiMethod">${['GET','POST','PUT','PATCH','DELETE'].map(m => `<option>${m}</option>`).join('')}</select>
      <input class="apiUrl" spellcheck="false" autocomplete="off">
      <button class="btn primary apiSend">Send ▶</button>
    </div>
    <textarea class="apiBody" spellcheck="false" placeholder='JSON body, e.g. {"name": "Laptop", "price": 999}' style="min-height:70px;margin-top:8px"></textarea>
    <div class="apiRes"></div>
  </div>`;
  const sel = el.querySelector('.apiMethod'), url = el.querySelector('.apiUrl'),
        body = el.querySelector('.apiBody'), res = el.querySelector('.apiRes'),
        send = el.querySelector('.apiSend');
  const syncBody = () => { body.style.display = BODY_METHODS.includes(sel.value) ? '' : 'none'; };
  const pick = r => { sel.value = r.method; url.value = r.url; body.value = r.body || ''; syncBody(); };
  el.querySelectorAll('.chip').forEach(c => { c.onclick = () => pick(routes[+c.dataset.i]); });
  sel.onchange = syncBody;
  pick(routes[0]);
  const doSend = async () => {
    send.disabled = true;
    try {
      const m = sel.value;
      const r = await sendReq(m, url.value.trim() || '/', BODY_METHODS.includes(m) ? body.value : '');
      const head = r.status + ' ' + (REASON[r.status] || '');
      res.innerHTML = terminal('response', head + '\n' + prettyBody(r.body), r.status >= 400 || r.status === 0) +
        (r.out ? terminal('server log (print output)', r.out.trimEnd()) : '');
    } catch (e) {
      res.innerHTML = terminal('error', String(e.message || e), true);
    }
    send.disabled = false;
  };
  send.onclick = doSend;
  url.addEventListener('keydown', e => { if (e.key === 'Enter') doSend(); });
}

function wirePlayground(startCode, resetCode, onChange){
  const ta = $('pgCode'), out = $('pgOut'), api = $('pgApi'), runBtn = $('pgRun');
  ta.value = startCode;
  fitTextarea(ta);
  const runIt = async () => {
    runBtn.disabled = true;
    api.innerHTML = '';
    try {
      const r = await execPy(ta.value, msg => { out.innerHTML = terminal('status', msg); });
      out.innerHTML = terminal(r.ok ? 'output' : 'error', r.out.trimEnd() || (r.ok ? '(ran with no output)' : ''), !r.ok);
      if (r.ok) {
        const routes = await getRoutes();
        if (routes.length) renderApi(api, routes);
      }
    } catch (e) {
      out.innerHTML = terminal('engine error', String(e.message || e), true);
    }
    runBtn.disabled = false;
  };
  runBtn.onclick = runIt;
  enableTab(ta, runIt);
  ta.addEventListener('input', () => { fitTextarea(ta); if (onChange) onChange(ta.value); });
  $('pgReset').onclick = () => {
    ta.value = resetCode; fitTextarea(ta);
    out.innerHTML = ''; api.innerHTML = '';
    if (onChange) onChange(resetCode);
  };
}

function apiPreamble(val){
  let p = 'from fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel\n';
  if (!/\bapp\s*=\s*FastAPI/.test(val)) p += 'app = FastAPI()\n';
  if (/\bnotes\b/.test(val) && !/\bnotes\s*=/.test(val)) p += 'notes = {1: {"id": 1, "title": "Sample", "body": ""}}\n';
  return p;
}

function renderLesson(id){
  const idx = FLAT.findIndex(f => f.lesson.id === id);
  if (idx === -1) return renderCheatsheet();
  const { module:mod, lesson:l } = FLAT[idx];
  const prev = FLAT[idx - 1];
  const next = FLAT[idx + 1];
  const isDone = !!store.done[l.id];
  const savedAnswer = store.answers[l.id] || '';

  let symbolsHtml = '';
  if (l.symbols && l.symbols.length) {
    symbolsHtml = '<h2>Symbols in this lesson</h2><div class="symbols">' +
      l.symbols.map(([s, d]) =>
        `<div class="sym"><code>${esc(s)}</code><span>${d}</span></div>`).join('') +
      '</div>';
  }

  main.innerHTML = `
    <div class="crumb">${mod.icon} ${esc(mod.title)}</div>
    <h1>${esc(l.title)}</h1>
    <p class="goal">${esc(l.goal)}</p>

    <div class="prose">${l.intro}</div>

    <h2>The code</h2>
    ${codeBlock(l.code, l.notes)}
    ${terminal('expected output', l.output)}

    ${playHtml(l)}

    ${symbolsHtml}

    <div class="exercise">
      <h3>✏️ Your turn</h3>
      <p>${l.exercise.prompt}</p>
      <textarea id="answer" spellcheck="false" placeholder="Type your Python here...">${esc(savedAnswer)}</textarea>
      <div class="ex-actions">
        <button class="btn primary" id="checkBtn">Check my code</button>
        <button class="btn" id="hintBtn">💡 Hint</button>
        <button class="btn" id="solBtn">Show solution</button>
        <button class="btn" id="runBtn">▶ Run</button>
      </div>
      <div class="fb" id="fb"></div>
    </div>

    <div class="lesson-nav">
      <button class="btn" id="prevBtn" ${prev ? '' : 'disabled style="opacity:.35"'}>← Previous</button>
      <div class="spacer"></div>
      <button class="btn ${isDone ? '' : 'primary'}" id="doneBtn">
        ${isDone ? '✓ Completed' : 'Mark as complete'}
      </button>
      <div class="spacer"></div>
      <button class="btn" id="nextBtn" ${next ? '' : 'disabled style="opacity:.35"'}>Next →</button>
    </div>
  `;

  const ta = $('answer');
  ta.addEventListener('input', () => { store.answers[l.id] = ta.value; save(); });

  $('checkBtn').onclick = async () => {
    const val = ta.value;
    /* ignore comments, so a commented-out answer does not count */
    const bare = val.replace(/("[^"\n]*"|'[^'\n]*')|#.*$/gm, (m, str) => str || '');
    const results = l.exercise.checks.map(([re, hint]) => [re.test(bare), hint]);
    const allOk = results.every(r => r[0]);
    const isApi = l.id.startsWith('fa-');
    let runErr = '', runOut = null;
    if (!NO_RUN[l.id]) {
      /* actually run the code: it must work, not just look right */
      const btn = $('checkBtn');
      btn.disabled = true;
      $('fb').innerHTML = terminal('status', 'Checking your code…');
      try {
        const pre = isApi ? apiPreamble(val) : (CTX_RUN[l.id] ? CTX_RUN[l.id](l) : '');
        const skip = pre ? pre.split('\n').length - 1 : 0;
        const r = await execPy(pre + val, msg => { $('fb').innerHTML = terminal('status', msg); }, skip);
        if (r.ok) runOut = r.out.trim(); else runErr = r.out.trim();
      } catch (e) {
        runErr = "Could not start the Python engine (" + (e.message || e) + "). Check your internet connection and try again.";
      }
      btn.disabled = false;
    }
    if (runErr) {
      $('fb').innerHTML = `<div class="row bad"><span>❌</span><div>Your code did not run cleanly.
        <div class="hint">Fix the error below, then check again.</div></div></div>` + terminal('error', runErr, true);
      return;
    }
    const sameOut = runOut !== null && !isApi && l.exercise.output != null && runOut === String(l.exercise.output).trim();
    const pass = allOk || sameOut;
    $('fb').innerHTML = (pass && !allOk ? '' : results.map(([ok, hint]) =>
      `<div class="row ${ok ? 'ok' : 'bad'}">
        <span>${ok ? '✅' : '❌'}</span>
        <div>${ok ? 'Nice — that part looks right.' : 'Not quite yet.'}
          ${ok ? '' : `<div class="hint">${esc(hint)}</div>`}</div>
      </div>`).join('')) +
      (pass ? `<div class="row ok"><span>🎉</span><div>${allOk ? 'All checks passed and your code runs! Lesson marked complete.' : 'Your code runs and prints the right output, even though it differs from the example. Lesson marked complete.'}</div></div>` : '');
    if (pass) { store.done[l.id] = true; save(); renderSidebar(l.id); updateProgress(); refreshDoneBtn(); }
  };

  $('hintBtn').onclick = () => {
    $('fb').innerHTML = `<div class="row"><span>💡</span><div>${esc(l.exercise.hint)}</div></div>`;
  };

  $('solBtn').onclick = () => {
    $('fb').innerHTML = `<div class="row"><span>📘</span><div>Solution:
      <div style="margin-top:6px">${codeBlock(l.exercise.solution)}</div></div></div>`;
  };

  enableTab(ta, () => $('runBtn').onclick());

  $('runBtn').onclick = async () => {
    const val = ta.value;
    const simulated = () => {
      const ok = l.exercise.checks.every(([re]) => re.test(val));
      return ok
        ? `<div class="row ok"><span>▶</span><div>Simulated output:</div></div>` + terminal('output', l.exercise.output)
        : `<div class="row bad"><span>▶</span><div>Your code does not look complete yet.
            <div class="hint">Click "Check my code" to see which parts are missing.</div></div></div>`;
    };
    if (NO_RUN[l.id]) { $('fb').innerHTML = simulated(); return; }
    const btn = $('runBtn');
    btn.disabled = true;
    $('fb').innerHTML = terminal('status', 'Running…');
    try {
      const isApi = l.id.startsWith('fa-');
      const pre = isApi ? apiPreamble(val) : (CTX_RUN[l.id] ? CTX_RUN[l.id](l) : '');
      const skip = pre ? pre.split('\n').length - 1 : 0;
      const r = await execPy(pre + val, msg => { $('fb').innerHTML = terminal('status', msg); }, skip);
      let text = r.out.trimEnd();
      if (r.ok && isApi) {
        const routes = await getRoutes();
        if (!routes.length) text += (text ? '\n' : '') + 'No route found yet — add an @app.get / @app.post / @app.delete decorator.';
        for (const rt of routes) {
          const q = await sendReq(rt.method, rt.url, BODY_METHODS.includes(rt.method) ? rt.body : '');
          text += (text ? '\n' : '') + rt.method + ' ' + rt.url + '  →  ' + q.status + '  ' + q.body;
          if (q.out) text += '\n' + q.out.trimEnd();
        }
      }
      $('fb').innerHTML = terminal(r.ok ? 'output' : 'error', text || '(ran with no output)', !r.ok);
    } catch (e) {
      $('fb').innerHTML = `<div class="row bad"><span>⚠️</span><div>Couldn't start the Python engine: ${esc(e.message || String(e))}
        <div class="hint">Showing the simulated result instead.</div></div></div>` + simulated();
    }
    btn.disabled = false;
  };

  if (!NO_RUN[l.id]) {
    wirePlayground(store.play[l.id] != null ? store.play[l.id] : l.code, l.code, v => {
      if (v === l.code) delete store.play[l.id]; else store.play[l.id] = v;
      save();
    });
  }

  $('doneBtn').onclick = () => {
    store.done[l.id] = !store.done[l.id];
    save(); renderSidebar(l.id); updateProgress(); refreshDoneBtn();
  };

  function refreshDoneBtn(){
    const b = $('doneBtn');
    if (!b) return;
    const d = !!store.done[l.id];
    b.textContent = d ? '✓ Completed' : 'Mark as complete';
    b.className = 'btn' + (d ? '' : ' primary');
  }

  if (prev) $('prevBtn').onclick = () => { location.hash = prev.lesson.id; };
  if (next) $('nextBtn').onclick = () => { location.hash = next.lesson.id; };

  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderCheatsheet(){
  let html = `
    <div class="crumb">📖 Reference</div>
    <h1>Symbol cheat sheet</h1>

  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'instant' });

  function draw(q){
    q = (q || '').toLowerCase().trim();
    let out = '';
    CHEATSHEET.forEach(group => {
      const rows = group.rows.filter(r =>
        !q || (r[0] + ' ' + r[1] + ' ' + r[2]).toLowerCase().includes(q));
      if (!rows.length) return;
      out += `<div class="cs-cat">${esc(group.cat)}</div><div class="cs-wrap">`;
      rows.forEach(r => {
        out += `<div class="cs-row">
          <div class="cs-sym">${esc(r[0])}</div>

          <div class="cs-ex">${esc(r[2]) || '&nbsp;'}</div>
        </div>`;
      });
      out += '</div>';
    });
    if (!out) out = '<p style="color:var(--muted)">No symbols match that search.</p>';
    $('csBody').innerHTML = out;
  }
  draw('');
  $('csSearch').addEventListener('input', e => draw(e.target.value));
}

function renderBigO(){
  const F=[['O(1)',n=>1,'#3fb950'],['O(log n)',n=>Math.log2(n),'#58a6ff'],['O(n)',n=>n,'#e3b341'],['O(n log n)',n=>n*Math.log2(n),'#f0883e'],['O(n²)',n=>n*n,'#ff7b72'],['O(2ⁿ)',n=>Math.pow(2,n),'#d2a8ff']];
  main.innerHTML='<div class="crumb">🎓 University track</div><h1>Big-O visualizer</h1><p class="goal">See how running time grows with input size n. The chart uses a log scale so every curve fits.</p><canvas id="bo" width="900" height="400" style="width:100%;border:1px solid var(--border);border-radius:12px;background:var(--panel)"></canvas><div class="mrow2">Chart n up to <input type="range" id="bn" min="5" max="60" value="30"><b id="bv">30</b></div><h2>How long would it really take?</h2><div class="mrow2">n = <input id="bm" type="number" min="1" value="1000000" class="search" style="width:170px"> at 1 billion steps per second</div><div id="bt"></div>';
  const fmt=s=>!isFinite(s)||s>=3.15e16?'never (longer than the universe has existed)':s<1e-6?'under 1 µs':s<1?(s*1e3).toFixed(2)+' ms':s<60?s.toFixed(2)+' s':s<3600?(s/60).toFixed(1)+' min':s<86400?(s/3600).toFixed(1)+' hours':s<3.15e7?(s/86400).toFixed(1)+' days':Math.round(s/3.15e7).toLocaleString('en')+' years';
  const draw=()=>{
    const N=+$('bn').value,cv=$('bo'),x=cv.getContext&&cv.getContext('2d');$('bv').textContent=N;if(!x)return;
    const W=900,H=400,P=36,top=Math.log10(Math.max(Math.pow(2,N),N*N,10)),mu=getComputedStyle(document.body).getPropertyValue('--muted');
    x.clearRect(0,0,W,H);x.font='12px sans-serif';x.fillStyle=mu;x.fillText('operations (log scale) ↑',P,16);x.fillText('n → '+N,W-72,H-8);
    F.forEach(([nm,f,c],k)=>{x.strokeStyle=c;x.lineWidth=2.5;x.beginPath();
      for(let n=2;n<=N;n++){const px=P+(n-2)/(N-2)*(W-2*P),py=H-P-Math.log10(Math.max(f(n),1))/top*(H-2*P);n===2?x.moveTo(px,py):x.lineTo(px,py);}
      x.stroke();x.fillStyle=c;x.fillRect(P+k*118,H-22,10,10);x.fillStyle=mu;x.fillText(nm,P+k*118+14,H-13);});
  };

  $('bn').oninput=draw;$('bm').oninput=tab;draw();tab();window.scrollTo({top:0,behavior:'instant'});
}

  const fs=m.querySelector('#fs');fs.oninput=()=>{ex.font=+fs.value;document.body.style.fontSize=ex.font+'px';sx();};
  m.querySelector('#fo').onchange=focus;
  m.querySelector('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({store,ex},null,1)],{type:'application/json'}));a.download='pypath-progress.json';a.click();};
  m.querySelector('#imp').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{const j=JSON.parse(t);PPLS.setItem(SK,JSON.stringify(j.store||{}));PPLS.setItem(XK,JSON.stringify(j.ex||{}));PPLS.flush().then(function(){location.reload()});}).catch(()=>toast('Invalid progress file'));};
  m.querySelector('#rst').onclick=()=>{if(confirm('Erase all progress, notes and settings?')){PPLS.removeItem(SK);PPLS.removeItem(XK);PPLS.flush().then(function(){location.reload()});}};
}
$('palBtn').onclick=pal;$('hud').onclick=()=>dash();

/* keyboard shortcuts */
addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal();}
  else if(e.key==='Escape')closeM();
  else if(e.altKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const b=$(e.key==='ArrowRight'?'nextBtn':'prevBtn');b&&b.click();}
  else if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(e.key==='/'){e.preventDefault();pal();}else if(e.key==='f')focus();else if(e.key==='t')theme.click();else if(e.key==='?')dash();
  }
});

/* copy buttons + reading time */
new MutationObserver(()=>{
  main.querySelectorAll('.codeblock:not([data-c]),.term:not([data-c])').forEach(b=>{
    b.dataset.c=1;const c=el('<button class="copy-btn">Copy</button>');
    c.onclick=()=>{const t=b.classList.contains('codeblock')?[...b.querySelectorAll('.cd')].map(x=>x.textContent).join('\n'):(b.querySelector('pre')||b).textContent;
      navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{c.textContent='Copied ✓';setTimeout(()=>c.textContent='Copy',1200);});};
    b.appendChild(c);
  });
  const cr=main.querySelector('.crumb:not([data-r])');
  if(cr){cr.dataset.r=1;if(main.querySelector('.prose'))cr.append(' · ~'+Math.max(1,Math.round(main.textContent.split(/\s+/).length/160))+' min read');}
}).observe(main,{childList:true,subtree:true});

/* progress watcher: XP toast, streak, confetti */
const _save=save;save=function(){_save.apply(this,arguments);try{scan();}catch(e){}};   /* award XP the instant progress is saved */
let day=ymd(new Date());
setInterval(()=>{scan();const d=ymd(new Date());if(d!==day){day=d;touch();toast('New day logged // streak '+streak());}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)touch();});
setInterval(()=>{if(!document.hidden){ex.time+=10;if(ex.time%60===0)sx();}},10000);

/* resume + init */
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(FLAT.some(f=>f.lesson.id===h)){ex.last=h;sx();}touch();});
if(ex.font!==16)document.body.style.fontSize=ex.font+'px';
if(ex.focus)document.body.classList.add('focus');
applyAcc();scan(true);touch();
if(!location.hash&&ex.last&&FLAT.some(f=>f.lesson.id===ex.last)){location.hash='#'+ex.last;toast('Welcome back — resuming your last lesson');}
else if(!location.hash&&!doneN()&&!Object.keys(store.baby||{}).length)location.hash='#baby';
})();
</script>
